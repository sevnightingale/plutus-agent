[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "plutus-agent"
version = "1.0.1"
description = "Plutus: an autonomous, self-improving trading agent. Perceives markets, forms theses, executes live on Hyperliquid, and learns from outcomes. Forked from NousResearch hermes-agent."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "plutus-agent contributors" }]
license = { text = "MIT" }
dependencies = [
  # Core — pinned to known-good ranges to limit supply chain attack surface
  "openai>=2.21.0,<3",
  "anthropic>=0.39.0,<1",
  "python-dotenv>=1.2.1,<2",
  "fire>=0.7.1,<1",
  "httpx[socks]>=0.28.1,<1",
  "rich>=14.3.3,<15",
  "tenacity>=9.1.4,<10",
  "pyyaml>=6.0.2,<7",
  "requests>=2.33.0,<3",  # CVE-2026-25645
  "jinja2>=3.1.5,<4",
  "pydantic>=2.12.5,<3",
  # Interactive CLI (prompt_toolkit is used directly by cli.py)
  "prompt_toolkit>=3.0.52,<4",
  # Tools
  "exa-py>=2.9.0,<3",
  "firecrawl-py>=4.16.0,<5",
  "parallel-web>=0.4.2,<1",
  "fal-client>=0.13.1,<1",
  # Text-to-speech (Edge TTS is free, no API key needed)
  "edge-tts>=7.2.7,<8",
  # Skills Hub (GitHub App JWT auth — optional, only needed for bot identity)
  "PyJWT[crypto]>=2.12.0,<3",  # CVE-2026-32597
  # plutus-agent Phase 4a: lifecycle.db vector embeddings
  "voyageai>=0.3.0,<1",        # voyage-finance-2 embedding model
  "sqlite-vec>=0.1.6,<0.2",    # SQLite vector-search loadable extension
  # plutus-agent Phase 4: Hyperliquid integration (perception + execution)
  "hyperliquid-python-sdk>=0.23,<1",  # Info (read) + Exchange (sign+send orders)
  # plutus-agent Phase 4: TA + flow integrations (pandas-ta over hl_candles)
  # numpy<2 is mandatory: pandas_ta 0.3.14b0 uses numpy.NaN which 2.x removed.
  "pandas>=2.0,<3",
  "numpy>=1.24,<2",
  # pandas-ta 0.3.x was yanked from PyPI (only 0.4.67b0 remains, requires
  # Python>=3.12 + numpy>=2 — bigger migration). Pinned to freqtrade's fork
  # at tag 0.3.14 (internally reports version 0.3.14b0, same code as upstream).
  # To upgrade later: bump Python>=3.12 + numpy>=2 + pandas-ta>=0.4 together.
  "pandas_ta @ git+https://github.com/freqtrade/pandas-ta.git@0.3.14",
]

[project.optional-dependencies]
modal = ["modal>=1.0.0,<2"]
daytona = ["daytona>=0.148.0,<1"]
dev = ["debugpy>=1.8.0,<2", "pytest>=9.0.2,<10", "pytest-asyncio>=1.3.0,<2", "pytest-xdist>=3.0,<4", "mcp>=1.2.0,<2", "ty>=0.0.1a29,<0.0.22", "ruff"]
messaging = ["python-telegram-bot[webhooks]>=22.6,<23", "discord.py[voice]>=2.7.1,<3", "aiohttp>=3.13.3,<4", "slack-bolt>=1.18.0,<2", "slack-sdk>=3.27.0,<4", "qrcode>=7.0,<8"]
cron = ["croniter>=6.0.0,<7"]
slack = ["slack-bolt>=1.18.0,<2", "slack-sdk>=3.27.0,<4"]
cli = ["simple-term-menu>=1.0,<2"]
tts-premium = ["elevenlabs>=1.0,<2"]
voice = [
  # Local STT pulls in wheel-only transitive deps (ctranslate2, onnxruntime),
  # so keep it out of the base install for source-build packagers like Homebrew.
  "faster-whisper>=1.0.0,<2",
  "sounddevice>=0.4.6,<1",
  "numpy>=1.24.0,<3",
]
pty = [
  "ptyprocess>=0.7.0,<1; sys_platform != 'win32'",
  "pywinpty>=2.0.0,<3; sys_platform == 'win32'",
]
mcp = ["mcp>=1.2.0,<2"]
mistral = ["mistralai>=2.3.0,<3"]
bedrock = ["boto3>=1.35.0,<2"]
termux = [
  # Tested Android / Termux path: keeps the core CLI feature-rich while
  # avoiding extras that currently depend on non-Android wheels (notably
  # faster-whisper -> ctranslate2 via the voice extra).
  "python-telegram-bot[webhooks]>=22.6,<23",
  "plutus-agent[cron]",
  "plutus-agent[cli]",
  "plutus-agent[pty]",
  "plutus-agent[mcp]",
]
web = ["fastapi>=0.104.0,<1", "uvicorn[standard]>=0.24.0,<1"]
all = [
  "plutus-agent[modal]",
  "plutus-agent[daytona]",
  "plutus-agent[messaging]",
  "plutus-agent[cron]",
  "plutus-agent[cli]",
  "plutus-agent[dev]",
  "plutus-agent[tts-premium]",
  "plutus-agent[slack]",
  "plutus-agent[pty]",
  "plutus-agent[mcp]",
  "plutus-agent[voice]",
  "plutus-agent[mistral]",
  "plutus-agent[bedrock]",
  "plutus-agent[web]",
]

[project.scripts]
plutus = "harness.cli.main:main"
plutus-agent = "harness.cli.main:main"

[tool.setuptools.package-data]
"harness.cli" = ["web_dist/**/*"]

[tool.setuptools.packages.find]
include = ["harness", "harness.*", "trading", "trading.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests requiring external services (API keys, Modal, etc.)",
]
addopts = "-m 'not integration' -n auto"

[tool.ty.environment]
python-version = "3.13"

[tool.ty.rules]
unknown-argument = "warn"
redundant-cast = "ignore"

[tool.ty.src]
exclude = ["**"]

[[tool.ty.overrides]]
include = ["**"]

[tool.ty.overrides.rules]
unresolved-import = "ignore"
invalid-method-override = "ignore"
invalid-assignment = "ignore"
not-iterable = "ignore"

[tool.ruff]
exclude = ["*"]

[tool.uv]
exclude-newer = "7 days"

# Setuptools >=70 unbundled `wheel`, so packages whose build_meta calls
# `bdist_wheel` (and don't declare it themselves) fail under uv's default
# build isolation. Add `wheel` to the build env for each affected package.
# Found via fresh `uv pip install -e ".[all,dev]"` from a clean venv.
[tool.uv.extra-build-dependencies]
pandas-ta = ["wheel"]
alibabacloud-tea-openapi = ["wheel"]
