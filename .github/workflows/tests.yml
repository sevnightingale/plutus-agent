name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: read

# Cancel in-progress runs for the same PR/branch
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install uv
        uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c  # v7.0.0

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv venv .venv --python 3.11
          source .venv/bin/activate
          # Pre-install build-time deps so packages whose setup.py needs
          # `bdist_wheel` (pandas-ta from freqtrade fork, alibabacloud-tea-openapi)
          # can build without isolation. setuptools<81 keeps pkg_resources
          # which pandas-ta 0.3.14b0 still imports at runtime.
          uv pip install "setuptools<81" wheel
          uv pip install --no-build-isolation -e ".[all,dev]"

      - name: Run tests
        # HONEST SCOPE NOTE: tests/ci-known-failures.txt is a ledger of tests
        # that pre-date the plutus-agent fork cleanup and do not pass yet
        # (inherited upstream debt + fork drift; tracked for repair). They are
        # explicitly deselected so this job is green on what the project DOES
        # support — a green badge here does not mean the ledger is empty.
        # Fixing a test = deleting its line from the ledger. The file is a
        # pytest @argfile: one --deselect=<nodeid> per line, comments not
        # supported by the format.
        run: |
          source .venv/bin/activate
          python -m pytest tests/ -q --ignore=tests/integration --ignore=tests/e2e --tb=short -n auto @tests/ci-known-failures.txt
        env:
          # Ensure tests don't accidentally call real APIs
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c  # v7.0.0

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv venv .venv --python 3.11
          source .venv/bin/activate
          # Pre-install build-time deps so packages whose setup.py needs
          # `bdist_wheel` (pandas-ta from freqtrade fork, alibabacloud-tea-openapi)
          # can build without isolation. setuptools<81 keeps pkg_resources
          # which pandas-ta 0.3.14b0 still imports at runtime.
          uv pip install "setuptools<81" wheel
          uv pip install --no-build-isolation -e ".[all,dev]"

      - name: Run e2e tests
        run: |
          source .venv/bin/activate
          python -m pytest tests/e2e/ -v --tb=short
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
